name: Security Audit (Bandit)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * 0' # Run weekly

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Bandit
      run: pip install bandit

    - name: Run Bandit Security Scan
      run: |
        # Scan all python files, ignore low severity (e.g. standard asserts in tests)
        bandit -r . -ll -ii
